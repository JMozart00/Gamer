<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ninja Warz — Remake</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><text y=%2224%22 font-size=%2224%22>🥷</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Persistent HUD -->
  <header id="hud" class="hud">
    <div class="hud-brand">Ninja Warz</div>
    <div class="hud-stats">
      <div class="hud-stat hud-gold" title="Gold">
        <span class="hud-icon">💰</span><span id="hud-gold-value">0</span>
      </div>
      <div class="hud-stat hud-karma" title="Karma">
        <span class="hud-icon">🔶</span><span id="hud-karma-value">0</span>
      </div>
      <div class="hud-stat hud-level" title="Account Level">
        <span class="hud-icon">🎖️</span>
        <span>Lv <span id="hud-level-value">1</span></span>
      </div>
    </div>
    <div class="hud-xp-track" title="Account XP">
      <div id="hud-xp-fill" class="hud-xp-fill"></div>
    </div>
  </header>

  <!-- Floating Island Hub -->
  <main id="island" class="island">
    <div class="island-clouds"></div>
    <div class="island-mass">
      <button class="hub-node" data-zone="dojo" style="--x: 50%; --y: 22%;">
        <span class="hub-node-icon">🥋</span>
        <span class="hub-node-label">Dojo</span>
      </button>
      <button class="hub-node" data-zone="recruit" style="--x: 20%; --y: 38%;">
        <span class="hub-node-icon">🧑‍🤝‍🧑</span>
        <span class="hub-node-label">Recruit Ninjas</span>
      </button>
      <button class="hub-node" data-zone="weapons" style="--x: 78%; --y: 40%;">
        <span class="hub-node-icon">🗡️</span>
        <span class="hub-node-label">Weapon Shop</span>
      </button>
      <button class="hub-node" data-zone="relics" style="--x: 15%; --y: 68%;">
        <span class="hub-node-icon">🏺</span>
        <span class="hub-node-label">Relic Shop</span>
      </button>
      <button class="hub-node" data-zone="hospital" style="--x: 82%; --y: 70%;">
        <span class="hub-node-icon">⛑️</span>
        <span class="hub-node-label">Hospital</span>
      </button>
      <button class="hub-node hub-node-daimyo" data-zone="daimyo" style="--x: 50%; --y: 80%;">
        <span class="hub-node-icon">🏯</span>
        <span class="hub-node-label">Daimyo</span>
      </button>
    </div>
  </main>

  <!-- Modal overlay root -->
  <div id="modal-root" class="modal-root" aria-hidden="true"></div>

  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
